```html
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container-fluid">

    <a class="navbar-brand fw-bold" href="#">
      Mi tienda
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">
            Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">
            Productos
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">
            Contacto
          </a>
        </li>

      </ul>

      <form class="d-flex">
        <input
          class="form-control me-2"
          type="search"
          placeholder="Buscar"
          aria-label="Search">

        <button
          class="btn btn-outline-success"
          type="submit">
          Buscar
        </button>
      </form>

    </div>
  </div>
</nav>


<div class="container my-5">

  <div class="d-flex flex-row justify-content-between align-items-center mb-4">

    <h2 class="fw-bold">
      Administración de productos
    </h2>

    <button
      type="button"
      class="btn btn-primary"
      (click)="GoToCreateProduct()">
      Crear producto
    </button>

  </div>


  <!-- PRODUCTOS -->

  <div class="d-flex flex-wrap">

    @for(producto of productos; track producto.id){

      <div class="card m-2" style="width: 18rem;"> 
        <img src="{{producto.imagenUrl}}" class="card-img-top" alt="..."> 
        <div class="card-body"> 
          <h5 class="card-title mb-2">{{producto.nombre}}</h5> 
          <p class="card-text mb-1">{{producto.descripcion}}</p> 
          <p class="card-text mb-1">{{producto.precio}}</p> 
          <p class="card-text mb-3">{{producto.stock}}</p> 
          <a href="#" class="btn btn-primary">Go somewhere</a> </div> </div>

    }

  </div>

</div>
```
